<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chấm Công VLBAOVE - Ca Ban Ngày</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        body { 
            background: #f8f9fc; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        .card { 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
        }
        .header-gradient { 
            background: linear-gradient(135deg, #4f46e5, #7c3aed); 
            color: white; 
        }
        .status-pill { 
            padding: 0.75rem 1.5rem; 
            border-radius: 50px; 
            font-weight: 600; 
            font-size: 1.1rem;
        }
        .total-box { 
            background: linear-gradient(135deg, #4f46e5, #7c3aed); 
            color: white; 
            border-radius: 16px; 
        }
        .btn-day { background-color: #10b981; border-color: #10b981; }
        .quick-btn { font-size: 0.95rem; padding: 12px 8px; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">

    <!-- ==================== LOGIN ==================== -->
    <div id="loginScreen">
        <div class="card mx-auto" style="max-width: 420px;">
            <div class="card-header header-gradient text-center py-4">
                <h4 class="mb-0"><i class="fas fa-clock me-2"></i>Chấm Công Ca Ban Ngày</h4>
            </div>
            <div class="card-body p-4">
                <div class="mb-3">
                    <label class="form-label fw-bold">Số hiệu nhân viên</label>
                    <input type="text" id="loginId" class="form-control form-control-lg" value="76" placeholder="Nhập số hiệu">
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" id="loginPass" class="form-control form-control-lg" placeholder="Nhập mật khẩu">
                </div>
                <button id="btnLogin" class="btn btn-primary btn-lg w-100">
                    <i class="fas fa-sign-in-alt me-2"></i>Đăng Nhập
                </button>
                <div id="loginError" class="text-danger text-center mt-3 fw-bold" style="display:none;">
                    ❌ Sai số hiệu hoặc mật khẩu!
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN APP ==================== -->
    <div id="mainApp" style="display: none;">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold text-primary mb-0">
                <i class="fas fa-sun"></i> Ca Ban Ngày - 6:30 ~ 18:30
            </h1>
            <div>
                <span class="badge bg-success fs-6 px-3 py-2">
                    <i class="fas fa-user me-1"></i> NV <span id="currentUserId"></span>
                </span>
                <button id="btnLogout" class="btn btn-outline-danger ms-3">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </div>
        </div>

        <div class="row g-4">
            
            <!-- TRẠNG THÁI HIỆN TẠI -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header header-gradient text-center py-3">
                        <h5 class="mb-0">Trạng Thái Hiện Tại</h5>
                    </div>
                    <div class="card-body text-center">
                        <div id="currentStatus" class="status-pill bg-light text-dark mb-4">
                            Chưa chấm công hôm nay
                        </div>
                        
                        <button id="btnCheckIn" class="btn btn-day btn-lg w-100 mb-3">
                            <i class="fas fa-sign-in-alt me-2"></i> CHECK-IN (Bắt đầu ca)
                        </button>
                        <button id="btnCheckOut" class="btn btn-danger btn-lg w-100" disabled>
                            <i class="fas fa-sign-out-alt me-2"></i> CHECK-OUT (Kết thúc ca)
                        </button>
                    </div>
                </div>
            </div>

            <!-- NHẬP CA NHANH & THỦ CÔNG -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header header-gradient">
                        <h5 class="mb-0">Nhập Ca Làm Việc</h5>
                    </div>
                    <div class="card-body">

                        <!-- Quick Buttons -->
                        <label class="form-label fw-bold text-primary mb-3">Ca nhanh (Ban ngày):</label>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <button class="btn btn-outline-primary w-100 quick-btn" data-shift="fullday">
                                    <i class="fas fa-sun fa-2x mb-2 d-block"></i>
                                    <strong>Ca Chính</strong><br>
                                    <small>6:30 — 18:30 (12 giờ)</small>
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-success w-100 quick-btn" data-shift="ot2">
                                    <i class="fas fa-clock fa-2x mb-2 d-block"></i>
                                    <strong>Làm thêm 2h</strong><br>
                                    <small>18:30 — 20:30</small>
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button class="btn btn-outline-warning w-100 quick-btn" data-shift="ot4">
                                    <i class="fas fa-clock fa-2x mb-2 d-block"></i>
                                    <strong>Làm thêm 4h</strong><br>
                                    <small>18:30 — 22:30</small>
                                </button>
                            </div>
                        </div>

                        <!-- Form thủ công -->
                        <form id="manualEntryForm">
                            <div class="row g-3">
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Ngày</label>
                                    <input type="date" id="inpDate" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold">Giờ vào</label>
                                    <input type="time" id="inpIn" class="form-control" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold">Giờ ra</label>
                                    <input type="time" id="inpOut" class="form-control">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Loại ca</label>
                                    <select id="selShift" class="form-select">
                                        <option value="day">Ca Ban Ngày</option>
                                        <option value="ot">Làm Thêm (OT)</option>
                                        <option value="night">Ca Đêm</option>
                                    </select>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="fas fa-save"></i> Lưu Ca
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- BẢNG CHẤM CÔNG -->
        <div class="card mt-4">
            <div class="card-header header-gradient d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Bảng Chấm Công Theo Tháng</h5>
                <input type="month" id="monthPicker" class="form-control" style="width: 180px;">
            </div>
            <div class="card-body">
                <div class="row g-4 mb-4 text-center">
                    <div class="col-md-6">
                        <div class="total-box p-4">
                            <h6>Tổng giờ tháng</h6>
                            <h2 id="totalHours" class="mb-0">0.00</h2>
                            <small>giờ</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="total-box p-4">
                            <h6>Tổng tiền tháng</h6>
                            <h2 id="totalSalary" class="mb-0">0</h2>
                            <small>VND (20.000/giờ)</small>
                        </div>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle" id="attendanceTable">
                        <thead class="table-light">
                            <tr>
                                <th>Ngày</th>
                                <th>Loại ca</th>
                                <th>Check-in</th>
                                <th>Check-out</th>
                                <th>Giờ trong tháng</th>
                                <th>Ghi chú</th>
                                <th>Hành động</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ==================== FIREBASE SCRIPT ==================== -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const app = initializeApp({ databaseURL: "https://vlbaovework-default-rtdb.firebaseio.com/" });
    const db = getDatabase(app);

    const correctId = "76";
    const correctPass = "noname67";

    let attendanceRef = null;

    // ==================== LOGIN ====================
    document.getElementById('btnLogin').onclick = () => {
        const id = document.getElementById('loginId').value.trim();
        const pass = document.getElementById('loginPass').value.trim();

        if (id === correctId && pass === correctPass) {
            attendanceRef = ref(db, `attendance/user1/entries`);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            document.getElementById('currentUserId').textContent = id;
            initApp();
        } else {
            document.getElementById('loginError').style.display = 'block';
            setTimeout(() => document.getElementById('loginError').style.display = 'none', 3000);
        }
    };

    // ==================== MAIN FUNCTION ====================
    function initApp() {
        let allRecords = {};

        const HOURLY_RATE = 20000;

        // Format helpers
        const fmtDate = (ts, withTime = false) => {
            if (!ts) return '—';
            const d = new Date(ts);
            return withTime 
                ? d.toLocaleString('vi-VN', {dateStyle:'short', timeStyle:'short'})
                : d.toLocaleDateString('vi-VN');
        };

        // Render table
        function renderTable(targetMonth) {
            const tbody = document.querySelector('#attendanceTable tbody');
            tbody.innerHTML = '';
            let totalHours = 0;

            Object.entries(allRecords).sort((a,b) => b[1].checkIn - a[1].checkIn).forEach(([id, entry]) => {
                if (!entry.checkIn) return;
                
                const cin = new Date(entry.checkIn);
                const monthStr = `${cin.getFullYear()}-${String(cin.getMonth()+1).padStart(2,'0')}`;
                
                if (monthStr !== targetMonth) return;

                const duration = entry.checkOut ? (entry.checkOut - entry.checkIn) / 3600000 : 0;
                totalHours += duration;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${fmtDate(entry.checkIn)}</td>
                    <td><span class="badge ${entry.shiftType === 'night' ? 'bg-dark' : 'bg-primary'}">${entry.shiftType === 'day' ? 'Ca Ngày' : entry.shiftType === 'ot' ? 'OT' : 'Ca Đêm'}</span></td>
                    <td>${fmtDate(entry.checkIn, true)}</td>
                    <td>${entry.checkOut ? fmtDate(entry.checkOut, true) : '<span class="text-warning">Đang làm</span>'}</td>
                    <td class="fw-bold">${duration.toFixed(2)}h</td>
                    <td>${entry.note || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary edit-btn me-1" data-id="${id}">Sửa</button>
                        <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${id}">Xóa</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('totalHours').textContent = totalHours.toFixed(2);
            document.getElementById('totalSalary').textContent = Math.round(totalHours * HOURLY_RATE).toLocaleString('vi-VN');
        }

        // Realtime listener
        onValue(attendanceRef, (snap) => {
            allRecords = snap.val() || {};
            const currentMonth = document.getElementById('monthPicker').value || new Date().toISOString().slice(0,7);
            renderTable(currentMonth);
        });

        // Quick buttons
        document.querySelectorAll('.quick-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.shift;
                const today = new Date().toISOString().slice(0,10);
                document.getElementById('inpDate').value = today;

                if (type === 'fullday') {
                    document.getElementById('inpIn').value = '06:30';
                    document.getElementById('inpOut').value = '18:30';
                    document.getElementById('selShift').value = 'day';
                } else if (type === 'ot2') {
                    document.getElementById('inpIn').value = '18:30';
                    document.getElementById('inpOut').value = '20:30';
                    document.getElementById('selShift').value = 'ot';
                } else if (type === 'ot4') {
                    document.getElementById('inpIn').value = '18:30';
                    document.getElementById('inpOut').value = '22:30';
                    document.getElementById('selShift').value = 'ot';
                }
            });
        });

        // Manual form
        document.getElementById('manualEntryForm').onsubmit = async (e) => {
            e.preventDefault();
            const date = document.getElementById('inpDate').value;
            const inTime = document.getElementById('inpIn').value;
            const outTime = document.getElementById('inpOut').value;
            const shiftType = document.getElementById('selShift').value;

            if (!date || !inTime) return alert("Vui lòng nhập ngày và giờ vào!");

            const checkIn = new Date(`${date}T${inTime}`).getTime();
            let checkOut = outTime ? new Date(`${date}T${outTime}`).getTime() : null;
            if (checkOut && checkOut < checkIn) checkOut += 86400000;

            const newRef = push(attendanceRef);
            await set(newRef, {
                checkIn: checkIn,
                checkOut: checkOut,
                shiftType: shiftType,
                note: shiftType === 'ot' ? 'Làm thêm' : ''
            });

            alert('✅ Đã lưu ca thành công!');
            e.target.reset();
        };

        document.getElementById('monthPicker').onchange = (e) => renderTable(e.target.value);
        
        // Check-in / Check-out (giữ nguyên logic cũ)
        // ... (bạn có thể copy phần này từ code cũ nếu cần)
    }

    document.getElementById('btnLogout').onclick = () => location.reload();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
